# Log retention for the expense agent.
#
# The app writes structured lines to stdout and systemd routes them to
# journald, which already handles rotation -- so there is no logrotate config
# to maintain and no log file that can fill the disk. All that is left is to
# bound it explicitly.
#
# Install to /etc/systemd/journald.conf.d/expense-agent.conf, then:
#   systemctl restart systemd-journald
[Journal]
SystemMaxUse=200M
MaxRetentionSec=1month
